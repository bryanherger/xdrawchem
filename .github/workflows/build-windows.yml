# build-windows.yml — Windows installer build
#
# Builds XDrawChem on Windows using MSVC (via Qt6 official installer via aqtinstall)
# and OpenBabel pre-built binaries, then packages with NSIS into a .exe installer.
# Runs on tag pushes (for releases) and PRs (smoke-testing).

name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'xdrawchem/**'
      - '.github/workflows/build-windows.yml'
  workflow_dispatch:

env:
  QT_VERSION: '6.7.3'
  QT_ARCH: win64_msvc2019_64
  OPENBABEL_VERSION: '3.2.1'

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5.0.1

      # Set up MSVC environment first — required by both OpenBabel
      # and XDrawChem cmake builds (provides cl.exe, nmake, ninja).
      # MSVC environment must be loaded in every cmd step that uses cl.exe/
      # ninja, because GitHub Actions shells do not persist vcvars across
      # steps.  Each step that calls cmake/build therefore sources vcvarsall.

      - name: Install Qt6 via aqtinstall
        run: |
          pip install aqtinstall
          # Qt SVG is bundled in the Qt6 base desktop package since Qt 6.5;
          # do not pass --modules (aqtinstall 3.x fails to find "qtsvg" by
          # that name for 6.7.3 because it is already in the base archive).
          aqt install-qt windows desktop ${{ env.QT_VERSION }} ${{ env.QT_ARCH }} `
            --outputdir C:\Qt
        shell: pwsh

      - name: Cache OpenBabel build
        id: cache-openbabel
        uses: actions/cache@v5
        with:
          path: C:\OpenBabel
          key: openbabel-3.2.1-msvc-x64

      - name: Clone OpenBabel source
        if: steps.cache-openbabel.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          :: Clone the 3.2.1 release tag (shallow)
          git clone --depth 1 --branch openbabel-3-2-1 https://github.com/openbabel/openbabel.git ob-src

          :: Patch deprecated std::binary_function in older MSVC toolsets / C++17 modes
          powershell -NoProfile -Command "Get-ChildItem ob-src -Recurse -Filter '*.h' | ForEach-Object { (Get-Content $_.FullName) -replace 'std::binary_function<([^>]+),\s*([^>]+),\s*([^>]+)>', 'std::function<bool(\1,\2)>' | Set-Content $_.FullName }"

      - name: Patch OpenBabel CMakeLists.txt to skip tools
        if: steps.cache-openbabel.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $txt = Get-Content ob-src/CMakeLists.txt -Raw
          $txt = $txt -replace '(?m)^(\s*)add_subdirectory\(tools\)', '$1# add_subdirectory(tools)  # disabled: only need library'
          Set-Content ob-src/CMakeLists.txt $txt

          $verify = Get-Content ob-src/CMakeLists.txt -Raw
          $matches = $verify | Select-String -Pattern '(?m)^(\s*)add_subdirectory\(tools\)' -AllMatches
          if ($matches.Matches.Count -gt 0) {
            Write-Error "Failed to patch ob-src/CMakeLists.txt: add_subdirectory(tools) still present"
            exit 1
          }
          Write-Host "Patched: ob-src/CMakeLists.txt (disabled tools)"

      - name: Build OpenBabel from source
        if: steps.cache-openbabel.outputs.cache-hit != 'true'
        shell: cmd
        run: |
          :: Activate MSVC environment for this step so cl.exe/ninja are on PATH.
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          :: Ensure MSVC tools are preferred over any MinGW that may be on PATH.
          set PATH=%VCINSTALLDIR%\bin\HostX64\x64;%PATH%

          :: Configure with explicit flags to build static libraries
          cmake -S ob-src -B ob-build ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_INSTALL_PREFIX=C:\OpenBabel ^
            -DBUILD_GUI=OFF ^
            -DENABLE_TESTS=OFF ^
            -DWITH_INCHI=OFF ^
            -DWITH_MAEPARSER=OFF ^
            -DWITH_COORDGEN=OFF ^
            -DBUILD_SHARED=OFF ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DCMAKE_WINDOWS_EXPORT_ALL_SYMBOLS=ON ^
            -DCMAKE_DISABLE_FIND_PACKAGE_LibXml2=TRUE ^
            -DCMAKE_DISABLE_FIND_PACKAGE_ZLIB=TRUE ^
            -DCMAKE_DISABLE_FIND_PACKAGE_Cairo=TRUE ^
            -DCMAKE_DISABLE_FIND_PACKAGE_Boost=TRUE

          :: Build (verbose) and install
          cmake --build ob-build --config Release -j %NUMBER_OF_PROCESSORS% --verbose
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

          cmake --install ob-build --config Release --verbose
          if %ERRORLEVEL% neq 0 exit /b %ERRORLEVEL%

          powershell -NoProfile -Command "Write-Host '=== ob-build artifacts (*.dll, *.lib) ==='; Get-ChildItem ob-build -Recurse -Include '*.dll','*.lib' | Select-Object FullName"

          powershell -NoProfile -Command "Write-Host '=== Installed C:\OpenBabel listing (depth 3) ==='; Get-ChildItem C:\OpenBabel -Depth 3 | Select-Object FullName"

      - name: Export OpenBabel path
        shell: pwsh
        run: |
          echo "OB_ROOT=C:\OpenBabel" >> $env:GITHUB_ENV
          echo "OB_ROOT=C:\OpenBabel"
          echo "C:\OpenBabel" | Out-File -FilePath "$env:RUNNER_TEMP\ob_root.txt" -Encoding UTF8

      - name: Configure CMake
        shell: cmd
        run: |
          :: Activate MSVC environment for this step so the correct compiler
          :: is selected; otherwise CMake may pick MinGW gcc from PATH.
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set PATH=%VCINSTALLDIR%\bin\HostX64\x64;%PATH%

          set QT_DIR=C:\Qt\${{ env.QT_VERSION }}\msvc2019_64
          set OB_ROOT=%OB_ROOT%

          :: Diagnostics: list candidate library locations.
          echo All .lib files in OB_ROOT (recursive):
          powershell -NoProfile -Command "Get-ChildItem %OB_ROOT% -Recurse -Filter '*.lib' | Select-Object FullName"
          echo All .a files in OB_ROOT (recursive):
          powershell -NoProfile -Command "Get-ChildItem %OB_ROOT% -Recurse -Filter '*.a' | Select-Object FullName"

          :: Candidate library names, in priority order.  OpenBabel built with
          :: MinGW produces a static libopenbabel.a; MSVC produces .lib files.
          set OB_LIB=
          for %%F in (
            "%OB_ROOT%\lib\openbabel-3.lib"
            "%OB_ROOT%\lib\openbabel3.lib"
            "%OB_ROOT%\lib\openbabel.lib"
            "%OB_ROOT%\lib\libopenbabel.a"
            "%OB_ROOT%\bin\openbabel-3.lib"
            "%OB_ROOT%\bin\openbabel3.lib"
            "%OB_ROOT%\bin\openbabel.lib"
            "%OB_ROOT%\bin\libopenbabel.a"
          ) do if not defined OB_LIB if exist %%F set OB_LIB=%%~F

          :: Fallback: any .lib, then any .a under OB_ROOT.
          if not defined OB_LIB (
            for /f "delims=" %%F in ('powershell -NoProfile -Command "Get-ChildItem %OB_ROOT% -Recurse -Filter '*.lib' | Select-Object -First 1 -ExpandProperty FullName"') do set OB_LIB=%%F
          )
          if not defined OB_LIB (
            for /f "delims=" %%F in ('powershell -NoProfile -Command "Get-ChildItem %OB_ROOT% -Recurse -Filter '*.a' | Select-Object -First 1 -ExpandProperty FullName"') do set OB_LIB=%%F
          )

          if not defined OB_LIB (
            echo OpenBabel library not found in OB_ROOT (no .lib/.a files found under %OB_ROOT%).
            exit /b 1
          )
          echo Using OB lib: %OB_LIB%

          :: Locate include dir dynamically (openbabel3 or openbabel).
          for /f "delims=" %%D in ('powershell -NoProfile -Command "$d = Get-ChildItem %OB_ROOT%\include -Directory -Recurse -ErrorAction SilentlyContinue ^| Where-Object { $_.Name -match '(?i)openbabel' } ^| Select-Object -First 1 -ExpandProperty FullName; if ($d) { $d } else { '%OB_ROOT%\include\openbabel3' }"') do set OB_INCLUDE=%%D
          echo Using OB include: %OB_INCLUDE%

          cmake -S xdrawchem -B build ^
            -G Ninja ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_C_COMPILER=cl.exe ^
            -DCMAKE_CXX_COMPILER=cl.exe ^
            -DCMAKE_PREFIX_PATH="%QT_DIR%" ^
            -DRINGHOME="ring" ^
            -DOpenBabel_FOUND=TRUE ^
            -DOpenBabel_INCLUDE_DIR="%OB_INCLUDE%" ^
            -DOpenBabel_INCLUDE_DIRS="%OB_INCLUDE%" ^
            -DOpenBabel_LIBRARY="%OB_LIB%" ^
            -DOpenBabel_LIBRARIES="%OB_LIB%"

      - name: Build
        shell: cmd
        run: |
          :: Ensure MSVC environment is active for the build as well.
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x64
          set PATH=%VCINSTALLDIR%\bin\HostX64\x64;%PATH%
          cmake --build build --config Release -j %NUMBER_OF_PROCESSORS% --verbose

      - name: Gather runtime dependencies (windeployqt)
        shell: pwsh
        run: |
          $QT_BIN = "C:\Qt\${{ env.QT_VERSION }}\msvc2019_64\bin"
          $OB_BIN = "$env:OB_ROOT\bin"

          New-Item -ItemType Directory -Force -Path dist\xdrawchem | Out-Null

          # Copy built binary
          Copy-Item build\xdrawchem.exe dist\xdrawchem\

          # Copy ring data
          New-Item -ItemType Directory -Force -Path dist\xdrawchem\ring | Out-Null
          Copy-Item xdrawchem\ring\* dist\xdrawchem\ring\ -Recurse

          # Copy Qt runtime DLLs
          & "$QT_BIN\windeployqt.exe" `
            --release `
            --no-translations `
            dist\xdrawchem\xdrawchem.exe

          # Copy OpenBabel runtime DLLs from vcpkg
          $OB_BIN = "$env:OB_ROOT\bin"
          if (Test-Path $OB_BIN) {
            Copy-Item "$OB_BIN\*.dll" dist\xdrawchem\ -ErrorAction SilentlyContinue
          }
          # Copy OB format plugins
          $OB_PLUGINS = "$env:OB_ROOT\bin\openbabel"
          if (Test-Path $OB_PLUGINS) {
            New-Item -ItemType Directory -Force -Path dist\xdrawchem\openbabel | Out-Null
            Copy-Item "$OB_PLUGINS\*.obf" dist\xdrawchem\openbabel\ -ErrorAction SilentlyContinue
          }

          # Copy MSVC runtime (if present)
          Get-ChildItem "C:\Windows\System32\vcruntime*.dll" |
            Copy-Item -Destination dist\xdrawchem\ -ErrorAction SilentlyContinue
          Get-ChildItem "C:\Windows\System32\msvcp*.dll" |
            Copy-Item -Destination dist\xdrawchem\ -ErrorAction SilentlyContinue

          Write-Host "=== dist\xdrawchem contents ==="
          Get-ChildItem dist\xdrawchem -Recurse | Select-Object FullName

      # NSIS is typically pre-installed on windows-latest runners.
      # If not, the "Build installer" step downloads it directly.

      - name: Write NSIS installer script
        shell: pwsh
        run: |
          # Version: prefer git tag (strip leading v), fall back to VERSION file
          $VERSION = if ($env:GITHUB_REF_NAME -match '^v') {
            $env:GITHUB_REF_NAME.TrimStart('v')
          } else {
            (Get-Content "$env:GITHUB_WORKSPACE\VERSION" -Raw).Trim()
          }

          @"
          !define APPNAME     "XDrawChem"
          !define APPVERSION  "$VERSION"
          !define PUBLISHER   "Bryan Herger"
          !define APPURL      "https://github.com/bryanherger/xdrawchem"
          !define INSTALLEREXE "XDrawChem-$VERSION-windows-x64.exe"

          Name "${APPNAME} ${APPVERSION}"
          OutFile "${INSTALLEREXE}"
          InstallDir "$PROGRAMFILES64\XDrawChem"
          InstallDirRegKey HKLM "Software\XDrawChem" "InstallDir"
          RequestExecutionLevel admin
          SetCompressor /SOLID lzma

          !include "MUI2.nsh"
          !insertmacro MUI_PAGE_WELCOME
          !insertmacro MUI_PAGE_DIRECTORY
          !insertmacro MUI_PAGE_INSTFILES
          !insertmacro MUI_PAGE_FINISH
          !insertmacro MUI_UNPAGE_CONFIRM
          !insertmacro MUI_UNPAGE_INSTFILES
          !insertmacro MUI_LANGUAGE "English"

          Section "XDrawChem" SecMain
            SetOutPath "$INSTDIR"
            File /r "dist\xdrawchem\*.*"

            ; Registry entries
            WriteRegStr HKLM "Software\XDrawChem" "InstallDir" "$INSTDIR"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\XDrawChem" \
              "DisplayName"          "XDrawChem ${APPVERSION}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\XDrawChem" \
              "UninstallString"      "$INSTDIR\uninstall.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\XDrawChem" \
              "Publisher"            "${PUBLISHER}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\XDrawChem" \
              "URLInfoAbout"         "${APPURL}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\XDrawChem" \
              "DisplayVersion"       "${APPVERSION}"

            ; Uninstaller
            WriteUninstaller "$INSTDIR\uninstall.exe"

            ; Start Menu shortcut
            CreateDirectory "$SMPROGRAMS\XDrawChem"
            CreateShortCut  "$SMPROGRAMS\XDrawChem\XDrawChem.lnk" \
              "$INSTDIR\xdrawchem.exe"
            CreateShortCut  "$SMPROGRAMS\XDrawChem\Uninstall.lnk" \
              "$INSTDIR\uninstall.exe"

            ; Desktop shortcut
            CreateShortCut "$DESKTOP\XDrawChem.lnk" "$INSTDIR\xdrawchem.exe"

            ; File associations
            WriteRegStr HKCR ".mol"  "" "XDrawChem.molfile"
            WriteRegStr HKCR "XDrawChem.molfile" "" "Chemical Structure (MDL Molfile)"
            WriteRegStr HKCR "XDrawChem.molfile\shell\open\command" "" \
              '"$INSTDIR\xdrawchem.exe" "%1"'
          SectionEnd

          Section "Uninstall"
            RMDir /r "$INSTDIR"
            Delete "$SMPROGRAMS\XDrawChem\XDrawChem.lnk"
            Delete "$SMPROGRAMS\XDrawChem\Uninstall.lnk"
            RMDir  "$SMPROGRAMS\XDrawChem"
            Delete "$DESKTOP\XDrawChem.lnk"
            DeleteRegKey HKLM "Software\XDrawChem"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\XDrawChem"
            DeleteRegKey HKCR ".mol"
            DeleteRegKey HKCR "XDrawChem.molfile"
          SectionEnd
          "@ | Out-File -Encoding UTF8 installer.nsi

      - name: Build installer with NSIS
        shell: pwsh
        run: |
          # Locate makensis.
          # Priority: (1) pre-installed system paths, (2) PATH, (3) direct
          # download of the NSIS zip from SourceForge — no Chocolatey.
          # Chocolatey's community feed is too flaky for CI reliability.
          $candidates = @(
            "C:\Program Files (x86)\NSIS\makensis.exe",
            "C:\Program Files\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $fromPath = Get-Command makensis -ErrorAction SilentlyContinue
            if ($fromPath) { $makensis = $fromPath.Source }
          }
          if (-not $makensis) {
            # winget is pre-installed on all win25 GitHub-hosted runners and is
            # more reliable than Chocolatey or direct SourceForge downloads.
            Write-Host "makensis not found — installing NSIS via winget..."
            winget install --id NSIS.NSIS --silent `
              --accept-source-agreements --accept-package-agreements 2>&1 | Write-Host
            $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $makensis) {
            Write-Error "makensis.exe not found after all attempts — aborting"
            exit 1
          }
          Write-Host "Using makensis: $makensis"
          & ([string]$makensis) installer.nsi
          Get-ChildItem *.exe | Select-Object Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7.0.0
        with:
          name: release-windows
          path: XDrawChem-*-windows-x64.exe
          retention-days: 14
